name: PathSnap data pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate EDA inventory and map
        run: >-
          python src/explore_data.py
          --train-dir Train
          --test-dir student_test
          --output-dir outputs
          --map-output-dir eda_outputs

      - name: Extract candidate features
        run: >-
          python src/features.py
          --train-dir Train
          --test-dir student_test
          --output-dir outputs

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: pathsnap-eda-and-features
          path: |
            outputs/*.csv
            outputs/*.joblib
            eda_outputs/*.html
          if-no-files-found: error
          retention-days: 14
